[workspace]
members  = ["packages/core", "packages/tauri", "packages/node", "packages/ffi", "packages/deno"]
resolver = "2"

[workspace.package]
authors    = ["Seokju Na <seokju.me@gmail.com>"]
edition    = "2024"
license    = "MIT"
repository = "https://github.com/webview-bundle/webview-bundle"

[workspace.dependencies]
anyhow    = "1"
napi      = "=3.5.2" # Pinned along with napi-derive.
serde     = "1.0"
tokio     = "1.47.1"
wvb       = { version = "0.3.0", path = "./packages/core" }
wvb-deno  = { version = "0.3.0", path = "./packages/deno" }
wvb-ffi   = { version = "0.3.0", path = "./packages/ffi" }
wvb-node  = { version = "0.3.1", path = "./packages/node" }
wvb-tauri = { version = "0.3.0", path = "./packages/tauri" }

[profile.release]
strip = "none" # Keep symbols for crash reports.
